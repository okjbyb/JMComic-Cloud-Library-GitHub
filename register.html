<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>注册 - JMComic Cloud</title><style>:root{font-family:system-ui,-apple-system,"Microsoft YaHei UI",sans-serif;color:#172026;background:#f4f6f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(390px,100%);background:#fff;border:1px solid #d5dde2;border-radius:8px;padding:24px}h1{font-size:22px;margin:0 0 6px}p{color:#657480;font-size:14px;margin:0 0 20px}label{display:block;font-size:13px;margin:12px 0 5px}input{width:100%;border:1px solid #b8c3ca;border-radius:6px;padding:11px;font:inherit;font-size:16px}button{width:100%;border:0;border-radius:6px;background:#0f766e;color:#fff;padding:11px;margin-top:18px;font:inherit;font-weight:600}.error{min-height:20px;color:#b42318;font-size:13px;margin-top:10px}a{color:#0f766e}</style></head><body><form class="panel" method="post" action="/register"><h1>注册账号</h1><p>每个账号拥有独立的 PDF 书库</p><label>用户名</label><input name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" required autofocus><label>密码</label><input name="password" type="password" minlength="10" required><label>确认密码</label><input name="confirm" type="password" minlength="10" required><div class="error">{{ERROR}}</div><button type="submit">注册</button><p style="margin-top:16px;text-align:center"><a href="/login">返回登录</a></p></form></body></html>
