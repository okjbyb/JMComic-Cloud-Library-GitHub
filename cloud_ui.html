<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="/manifest.webmanifest"><title>JMComic Cloud</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Microsoft YaHei UI",sans-serif;color:#172026;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}header{height:56px;background:#fff;border-bottom:1px solid #d7dde2;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:8}h1{font-size:18px;margin:0;letter-spacing:0}.logout{border:1px solid #cbd5dc;background:#fff;border-radius:5px;padding:7px 10px}main{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 56px)}nav{background:#fff;border-right:1px solid #d7dde2;padding:12px}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:6px;font-size:14px}nav button.active{background:#0f766e;color:#fff}section{display:none;padding:18px;max-width:1280px}section.active{display:block}.band{background:#fff;border:1px solid #d7dde2;border-radius:6px;padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;color:#52616d;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #b9c3cc;border-radius:5px;padding:9px;background:#fff;font:inherit;letter-spacing:0}textarea{min-height:112px;resize:vertical}.primary,.secondary{border-radius:5px;padding:9px 14px;cursor:pointer}.primary{background:#0f766e;color:#fff;border:0}.secondary{background:#eef2f4;color:#172026;border:1px solid #cbd5dc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff}th,td{border-bottom:1px solid #e0e6ea;padding:8px;text-align:left;font-size:13px;vertical-align:middle}th{background:#f0f3f5;color:#394854}.muted{color:#657480;font-size:12px}.log{height:420px;background:#101417;color:#d8f3dc;border-radius:6px;padding:10px;overflow:auto;font:12px Consolas,monospace;white-space:pre-wrap}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.book{border:1px solid #dbe2e6;border-radius:6px;padding:12px;min-width:0}.book strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.book .actions{margin-top:10px}.phone-url{font:13px Consolas,monospace;color:#0f766e;word-break:break-all;margin-top:5px}.toast{position:fixed;right:18px;bottom:18px;background:#172026;color:#fff;padding:10px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1}
    @media(max-width:900px){header{height:48px;padding:0 12px}header h1{font-size:16px}main{display:block;padding-bottom:72px}nav{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;overflow-x:auto;border:0;border-top:1px solid #d7dde2;padding:6px env(safe-area-inset-right) calc(6px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}nav button{min-width:78px;text-align:center;padding:8px 5px;font-size:12px}section{padding:10px}.grid,.grid2{grid-template-columns:1fr}.band{padding:10px}.table-wrap{margin:0 -10px;padding:0 10px}table{min-width:700px}input,select,textarea{font-size:16px}.books{grid-template-columns:1fr}.toast{left:12px;right:12px;bottom:82px;text-align:center}}
  </style>
  <style>
    .danger{background:#fff;color:#b42318;border:1px solid #f0aaa4;border-radius:5px;padding:9px 14px;cursor:pointer}
    .danger:disabled{opacity:.45;cursor:not-allowed}
    .book-head{display:grid;grid-template-columns:22px minmax(0,1fr);gap:7px;align-items:center}
    .book-check,.select-all{width:18px;height:18px;margin:0;accent-color:#0f766e}
    .library-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .library-tools label{display:flex;align-items:center;gap:7px;margin:0;font-size:14px;color:#172026}
    #selectionCount{margin-left:auto}
  </style>
</head>
<body><header><h1>JMComic Cloud</h1><div><a class="logout" href="/account">账号设置</a> <form method="post" action="/logout" style="display:inline"><button class="logout">退出</button></form></div></header><main><nav><button class="active" data-tab="download">下载</button><button data-tab="query">搜索</button><button data-tab="browse">推荐排行</button><button data-tab="library">PDF 书库</button><button data-tab="logs">日志</button></nav><div>
  <section id="download" class="active"><div class="band"><strong>OPDS 地址</strong><div id="opdsInfo" class="phone-url"></div></div><div class="band"><div class="grid2"><div><label>下载 ID，空格或换行分隔；章节可写 p123</label><textarea id="downloadIds"></textarea></div><div><label>下载模式</label><select id="downloadMode"><option value="album">整部作品生成一个 PDF</option><option value="photo">每个章节生成一个 PDF</option><option value="mixed">自动识别 p 前缀</option></select></div></div><div class="grid"><div><label>客户端</label><select id="clientImpl"><option value="api">api</option><option value="html">html</option></select></div><div><label>代理</label><input id="proxy" value="null"></div><div><label>图片并发</label><input id="imageThreads" value="20"></div><div><label>章节并发</label><input id="photoThreads" value="4"></div></div><div class="actions"><button class="primary" onclick="downloadBooks()">开始后台下载</button></div></div></section>
  <section id="query"><div class="band"><div class="grid"><div><label>ID 或包含数字的文本</label><input id="detailId"></div><div><label>关键词</label><input id="searchQuery"></div><div><label>页码</label><input id="searchPage" value="1"></div><div><label>范围</label><select id="mainTag"><option value="0">站内</option><option value="1">作品</option><option value="2">作者</option><option value="3">标签</option><option value="4">角色</option></select></div><div><label>排序</label><select id="searchOrder"><option value="latest">最新</option><option value="view">观看</option><option value="picture">图片数</option><option value="like">点赞</option></select></div><div><label>时间</label><select id="searchTime"><option value="all">全部</option><option value="today">今日</option><option value="week">本周</option><option value="month">本月</option></select></div><div><label>分类</label><select id="searchCategory"></select></div><div><label>副分类</label><select id="searchSubCategory"></select></div></div><div class="actions"><button class="primary" onclick="detail()">查详情</button><button class="primary" onclick="searchBooks()">搜索</button><button class="secondary" onclick="downloadSelected('resultTable')">下载选中项</button></div></div><div class="band"><div id="detailOut" class="muted"></div><div class="table-wrap"><table id="resultTable"></table></div></div></section>
  <section id="browse"><div class="band"><div class="grid"><div><label>榜单</label><select id="rankMode"><option value="day">日排行</option><option value="week">周排行</option><option value="month">月排行</option><option value="custom">自定义</option></select></div><div><label>页码</label><input id="browsePage" value="1"></div><div><label>时间</label><select id="browseTime"><option value="all">全部</option><option value="today">今日</option><option value="week">本周</option><option value="month">本月</option></select></div><div><label>分类</label><select id="browseCategory"></select></div><div><label>排序</label><select id="browseOrder"><option value="view">观看</option><option value="latest">最新</option><option value="picture">图片数</option><option value="like">点赞</option></select></div><div><label>副分类</label><select id="browseSubCategory"></select></div></div><div class="actions"><button class="primary" onclick="browse()">加载榜单</button><button class="secondary" onclick="downloadSelected('browseTable')">下载选中项</button></div></div><div class="band table-wrap"><table id="browseTable"></table></div></section>
  <section id="library"><div class="band"><div class="library-tools"><button class="primary" onclick="loadLibrary()">刷新书库</button><label><input class="select-all" type="checkbox" onchange="toggleAllBooks(this.checked)">全选</label><button id="deleteSelected" class="danger" onclick="deleteSelectedBooks()" disabled>删除选中</button><span id="selectionCount" class="muted">共 0 本</span></div></div><div id="books" class="books"></div></section>
  <section id="logs"><div class="band"><div id="log" class="log"></div></div></section>
</div></main><div id="toast" class="toast"></div>
<script>
const cat=[["all","全部"],["doujin","同人"],["single","单本"],["short","短篇"],["another","其他"],["hanman","韩漫"],["meiman","美漫"],["cosplay","Cosplay"],["3d","3D"],["english","英文站"]],sub=[["","无"],["chinese","中文"],["japanese","日文"],["cg","CG"],["youth","青年"],["other","其他漫画"],["3d","3D"],["cosplay","Cosplay"]];for(const id of ["searchCategory","browseCategory"])document.getElementById(id).innerHTML=cat.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");for(const id of ["searchSubCategory","browseSubCategory"])document.getElementById(id).innerHTML=sub.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,section").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active");if(b.dataset.tab==="library")loadLibrary()});
const v=id=>document.getElementById(id).value;function cfg(){return{baseDir:"/data",clientImpl:v("clientImpl"),proxy:v("proxy"),imageThreads:v("imageThreads"),photoThreads:v("photoThreads")}}function toast(s){const x=document.getElementById("toast");x.textContent=s;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}async function api(url,data){const o=data?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(data)}:{};const r=await fetch(url,o);if(r.status===401){location.href="/login";return{ok:false}}const j=await r.json();if(!j.ok)alert(j.error||"操作失败");return j}const esc=s=>String(s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function table(id,rows){document.getElementById(id).innerHTML=`<thead><tr><th><input type="checkbox" onchange="document.querySelectorAll('#${id} tbody input').forEach(i=>i.checked=this.checked)"></th><th>ID</th><th>标题</th><th>标签</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><input type="checkbox" data-id="${r.id}"></td><td>${r.id}</td><td>${esc(r.title)}</td><td>${esc((r.tags||[]).join(", "))}</td><td><button class="primary" onclick="downloadOne('${r.id}')">下载</button></td></tr>`).join("")}</tbody>`}function selected(id){return[...document.querySelectorAll(`#${id} tbody input:checked`)].map(x=>x.dataset.id)}async function queue(ids,mode="album"){if(!ids.length)return alert("请输入或选择 ID");const j=await api("/api/download",{...cfg(),ids,mode});if(j.ok)toast(`已加入后台任务：${ids.length} 项`)}function downloadBooks(){queue(v("downloadIds").split(/[\s,，;；]+/).filter(Boolean),v("downloadMode"))}function downloadOne(id){queue([id])}function downloadSelected(id){queue(selected(id))}
async function detail(){const j=await api("/api/detail",{...cfg(),text:v("detailId")});if(j.ok)document.getElementById("detailOut").innerHTML="<pre>"+esc(j.detail)+"</pre>"}async function searchBooks(){const j=await api("/api/search",{...cfg(),query:v("searchQuery"),page:v("searchPage"),mainTag:v("mainTag"),order:v("searchOrder"),time:v("searchTime"),category:v("searchCategory"),subCategory:v("searchSubCategory")});if(j.ok)table("resultTable",j.rows)}async function browse(){const j=await api("/api/browse",{...cfg(),page:v("browsePage"),mode:v("rankMode"),time:v("browseTime"),category:v("browseCategory"),order:v("browseOrder"),subCategory:v("browseSubCategory")});if(j.ok)table("browseTable",j.rows)}function size(n){return n>1048576?(n/1048576).toFixed(1)+" MB":(n/1024).toFixed(0)+" KB"}async function loadLibrary(){const j=await api("/api/library");if(!j.ok)return;document.getElementById("books").innerHTML=j.books.length?j.books.map(b=>`<article class="book"><strong title="${esc(b.title)}">${esc(b.title)}</strong><div class="muted">${size(b.size)} · ${new Date(b.modified).toLocaleString()}</div><div class="actions"><a class="primary" href="/reader?path=${encodeURIComponent(b.path)}">阅读</a><a class="secondary" href="/files/pdf?path=${encodeURIComponent(b.path)}" download>下载</a></div></article>`).join(""):"<div class='band muted'>暂无 PDF</div>"}async function poll(){const j=await api("/api/logs"),x=document.getElementById("log");if(j.ok){x.textContent=j.text;x.scrollTop=999999}setTimeout(poll,1500)}async function info(){const j=await api("/api/info");if(j.ok)document.getElementById("opdsInfo").innerHTML=j.opdsUrls.map(x=>`<div>${esc(x)}</div>`).join("")+`<div>用户名：${esc(j.opdsUsername)}</div>`}info();poll();
function selectedBookPaths(){return[...document.querySelectorAll(".book-check:checked")].map(x=>decodeURIComponent(x.dataset.path))}
function syncBookSelection(){const all=[...document.querySelectorAll(".book-check")],selected=all.filter(x=>x.checked),master=document.querySelector(".select-all"),button=document.getElementById("deleteSelected");if(master){master.checked=all.length>0&&selected.length===all.length;master.indeterminate=selected.length>0&&selected.length<all.length}if(button)button.disabled=selected.length===0;document.getElementById("selectionCount").textContent=selected.length?`已选 ${selected.length} 本，共 ${all.length} 本`:`共 ${all.length} 本`}
function toggleAllBooks(checked){document.querySelectorAll(".book-check").forEach(x=>x.checked=checked);syncBookSelection()}
function deleteOneBook(button){deleteBookPaths([decodeURIComponent(button.dataset.path)])}
function deleteSelectedBooks(){deleteBookPaths(selectedBookPaths())}
async function deleteBookPaths(paths){if(!paths.length)return;if(!confirm(`确定永久删除选中的 ${paths.length} 本 PDF 吗？此操作无法撤销。`))return;const j=await api("/api/library/delete",{paths});if(j.ok){toast(`已删除 ${j.deleted} 本，释放 ${size(j.freed)}`);await loadLibrary()}}
async function loadLibrary(){const j=await api("/api/library");if(!j.ok)return;const books=document.getElementById("books");books.innerHTML=j.books.length?j.books.map(b=>`<article class="book"><div class="book-head"><input class="book-check" type="checkbox" data-path="${encodeURIComponent(b.path)}" onchange="syncBookSelection()" aria-label="选择 ${esc(b.title)}"><strong>${esc(b.title)}</strong></div><div class="muted">${size(b.size)} · ${new Date(b.modified).toLocaleString()}</div><div class="actions"><a class="primary" href="/reader?path=${encodeURIComponent(b.path)}">阅读</a><a class="secondary" href="/files/pdf?path=${encodeURIComponent(b.path)}" download>下载</a><button class="danger" data-path="${encodeURIComponent(b.path)}" onclick="deleteOneBook(this)">删除</button></div></article>`).join(""):"<div class='band muted'>暂无 PDF</div>";const master=document.querySelector(".select-all");if(master){master.checked=false;master.indeterminate=false}syncBookSelection()}
</script></body></html>
