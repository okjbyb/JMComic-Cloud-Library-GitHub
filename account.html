<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>账号设置 - JMComic Cloud</title><style>:root{font-family:system-ui,-apple-system,"Microsoft YaHei UI",sans-serif;color:#172026;background:#f4f6f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(420px,100%);background:#fff;border:1px solid #d5dde2;border-radius:8px;padding:24px}h1{font-size:22px;margin:0 0 6px}.meta{color:#657480;font-size:14px;margin-bottom:20px}label{display:block;font-size:13px;margin:12px 0 5px}input{width:100%;border:1px solid #b8c3ca;border-radius:6px;padding:11px;font:inherit;font-size:16px}button{width:100%;border:0;border-radius:6px;background:#0f766e;color:#fff;padding:11px;margin-top:18px;font:inherit;font-weight:600}.error{color:#b42318;font-size:13px;margin-top:10px}.success{color:#067647;font-size:13px;margin-top:10px}a{color:#0f766e}</style></head><body><form class="panel" method="post" action="/account/password"><h1>账号设置</h1><div class="meta">{{USERNAME}} · {{ROLE}} · <a href="/">返回首页</a></div><label>当前密码</label><input name="current_password" type="password" required><label>新密码</label><input name="new_password" type="password" minlength="10" required><label>确认新密码</label><input name="confirm" type="password" minlength="10" required><div class="error">{{ERROR}}</div><div class="success">{{SUCCESS}}</div><button type="submit">更改密码</button></form></body></html>
