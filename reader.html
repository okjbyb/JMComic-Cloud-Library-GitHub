<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>{{TITLE}}</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111827;font-family:system-ui,-apple-system,sans-serif}.bar{height:52px;padding:0 12px;display:flex;align-items:center;gap:10px;color:#fff}.bar strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.bar a{color:#fff;text-decoration:none;border:1px solid #536170;border-radius:5px;padding:7px 10px}.pdf{display:block;width:100%;height:calc(100% - 52px);border:0;background:#fff}@media(max-width:600px){.bar{padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top))}.pdf{height:calc(100% - 52px - env(safe-area-inset-top))}}</style></head>
<body><div class="bar"><a href="/">返回</a><strong>{{TITLE}}</strong><a href="{{PDF_URL}}" target="_blank">原生打开</a></div><iframe class="pdf" src="{{PDF_URL}}#view=FitH&toolbar=1"></iframe></body>
</html>
