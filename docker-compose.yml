services:
  jmcomic-cloud:
    build: .
    container_name: jmcomic-cloud
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8765"
    environment:
      - JM_ACCEL_REDIRECT=true
      - JM_PDF_OPTIMIZE=true
      - JM_PDF_OPTIMIZE_START_DELAY=90
    volumes:
      - jmcomic_data:/data
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.28-alpine
    container_name: jmcomic-nginx
    restart: unless-stopped
    depends_on:
      jmcomic-cloud:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - jmcomic_data:/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true

volumes:
  jmcomic_data:
    name: jmcomic_cloud_data
