<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>登录 - JMComic Cloud</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Microsoft YaHei UI",sans-serif;color:#172026;background:#f4f6f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(390px,100%);background:#fff;border:1px solid #d5dde2;border-radius:8px;padding:24px}h1{font-size:22px;margin:0 0 6px;letter-spacing:0}p{color:#657480;font-size:14px;margin:0 0 22px}label{display:block;font-size:13px;margin:12px 0 5px}input{width:100%;border:1px solid #b8c3ca;border-radius:6px;padding:11px;font:inherit;font-size:16px}button{width:100%;border:0;border-radius:6px;background:#0f766e;color:#fff;padding:11px;margin-top:18px;font:inherit;font-weight:600}.error{min-height:20px;color:#b42318;font-size:13px;margin-top:10px}
  </style>
</head>
<body><form class="login" method="post" action="/login"><h1>JMComic Cloud</h1><p>账号登录</p><label>用户名</label><input name="username" autocomplete="username" required autofocus><label>密码</label><input name="password" type="password" autocomplete="current-password" required><div class="error">{{ERROR}}</div><button type="submit">登录</button><p style="margin-top:16px;text-align:center"><a href="/register">注册新账号</a></p></form></body>
</html>
